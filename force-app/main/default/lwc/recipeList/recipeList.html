<template>
    <lightning-card title="Recipes" icon-name="standard:recipe">
        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <!-- Search box -->
            <lightning-input
                type="search"
                label="Search recipes"
                variant="label-hidden"
                placeholder="Search recipes by name"
                onchange={handleSearchChange}
            ></lightning-input>

            <!-- Loading, error, results, or empty state: only one of these shows at a time -->
            <template lwc:if={hasError}>
                <div
                    class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-var-m-top_small"
                    role="alert"
                >
                    <div class="slds-media__figure">
                        <lightning-icon
                            icon-name="utility:error"
                            variant="inverse"
                            size="x-small"
                        ></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <p>We couldn't load the recipes. {errorMessage}</p>
                    </div>
                </div>
            </template>
            <template lwc:elseif={isLoading}>
                <div class="slds-is-relative slds-var-p-around_xx-large">
                    <lightning-spinner
                        alternative-text="Loading recipes"
                        size="small"
                    ></lightning-spinner>
                </div>
            </template>
            <template lwc:elseif={hasRecipes}>
                <p
                    class="slds-var-m-vertical_small slds-text-body_small slds-text-color_weak"
                >
                    {resultsSummary}
                </p>
                <ul>
                    <template for:each={recipeTiles} for:item="recipe">
                        <li key={recipe.id} class="slds-var-m-bottom_x-small">
                            <!-- Each recipe is a button so it works with a keyboard and screen readers -->
                            <button
                                type="button"
                                class="recipe-tile"
                                data-recipe-id={recipe.id}
                                aria-pressed={recipe.isSelected}
                                onclick={handleRecipeClick}
                            >
                                <span class="slds-show slds-text-heading_small"
                                    >{recipe.name}</span
                                >
                                <span
                                    class="recipe-details slds-text-body_small"
                                >
                                    <span
                                        lwc:if={recipe.complexity}
                                        class="slds-badge"
                                    >
                                        {recipe.complexity}
                                    </span>
                                    <span lwc:if={recipe.season}
                                        >{recipe.season}</span
                                    >
                                    <span
                                        lwc:if={recipe.activeTime}
                                        class="slds-grid slds-grid_vertical-align-center"
                                    >
                                        <lightning-icon
                                            icon-name="utility:clock"
                                            size="xx-small"
                                            alternative-text="Active time"
                                            class="slds-var-m-right_xx-small"
                                        ></lightning-icon>
                                        {recipe.activeTime}
                                    </span>
                                </span>
                            </button>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:else>
                <div
                    class="slds-text-align_center slds-text-color_weak slds-var-p-around_large"
                >
                    <p class="slds-text-heading_small">No recipes found</p>
                    <p>Try a different search.</p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
